name: BATS Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ts_test_diag:
        description: 'Enable TS_TEST_DIAG + TS_TEST_TRACE for ts_test.bats debugging'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - test/api_contract_test.bats
          - test/cli_rename_test.bats
          - test/config_test.bats
          - test/context_test.bats
          - test/escaping_test.bats
          - test/expose_test.bats
          - test/first_test.bats
          - test/fzf_dims_test.bats
          - test/fzf_format_test.bats
          - test/gitshelf_demo_test.bats
          - test/help_preview_test.bats
          - test/help_topic_test.bats
          - test/integration_test.bats
          - test/lint_test.bats
          - test/location_test.bats
          - test/module_provenance_test.bats
          - test/new_commands_test.bats
          - test/npm_test.bats
          - test/out_test.bats
          - test/query_executor_test.bats
          - test/pipeline_state_test.bats
          - test/parse_bash_test.bats
          - test/smoke_test.bats
          - test/synopsis_test.bats
          - test/test.bats
          - test/ts_test.bats

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Bash
        run: bash --version

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jc

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Node.js dependencies (tree-sitter)
        run: pnpm install

      - name: Install npm test fixture
        run: npm --prefix test/fixtures/npm-project install

      - name: Install BATS
        run: sudo ./test/bats/install.sh /usr/local

      - name: Run ${{ matrix.test-file }}
        # Problem: https://github.com/actions/runner/issues/241
        # Solution: https://github.com/gfx/example-github-actions-with-tty?tab=readme-ov-file
        shell: 'script -q -e -c "bash {0}" /dev/null'
        env:
          TERM: xterm-256color
          # Signal-kill diagnostics for ts_test.bats (only that file reads
          # these). Off by default; enable via the workflow_dispatch input.
          TS_TEST_DIAG: ${{ inputs.ts_test_diag && '1' || '' }}
          TS_TEST_TRACE: ${{ inputs.ts_test_diag && '1' || '' }}
        run: |
          source ./activate -t
          rc=0
          bats --jobs "$(nproc)" "${{ matrix.test-file }}" || rc=$?
          # Dump per-test TS_TEST_DIAG files: fd-3 writes at process-exit time
          # are swallowed by the bats runner, so the EXIT record only survives
          # in these files. Absence of an EXIT line for a vanished test = SIGKILL.
          cat /tmp/ts_diag.*.log 2>/dev/null || true
          exit "$rc"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Node.js dependencies (tree-sitter)
        run: pnpm install

      - name: Lint BashTab against its own invariants
        # New error-severity findings fail the build; everything already
        # present is recorded in .bulintbaseline. Regenerate that file with
        #   bu validate-script --all --write-baseline .bulintbaseline
        run: |
          node lib/lint/bu_lint.js \
            --root "$PWD" \
            --severity error \
            --baseline .bulintbaseline \
            $(find lib/core commands config -name '*.sh' -type f | sort)

      - name: Report full findings (informational)
        if: always()
        run: |
          node lib/lint/bu_lint.js --root "$PWD" \
            $(find lib/core commands config -name '*.sh' -type f | sort) \
            | sort -k3 || true
